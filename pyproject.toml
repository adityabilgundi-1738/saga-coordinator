[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "saga-coordinator"
version = "0.1.0"
description = "Distributed Saga Pattern Transaction Coordinator with Durable WAL & Compensation Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["saga*"]
